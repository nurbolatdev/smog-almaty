<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Смог в Алматы — анализ и прогноз PM2.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a37"/>
      <stop offset="0.55" stop-color="#4a5361"/>
      <stop offset="1" stop-color="#a3927c"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b79c" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#c9b79c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b8a487" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.35" stop-color="#eab308"/>
      <stop offset="0.65" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- дальние горы Заилийского Алатау -->
  <path d="M0 210 L90 150 L150 175 L240 95 L300 135 L380 70 L450 120 L520 85 L600 140 L690 60 L760 115 L840 80 L930 135 L1010 75 L1090 125 L1170 90 L1280 140 L1280 320 L0 320 Z" fill="#3a4350"/>
  <!-- снежные шапки -->
  <path d="M240 95 L270 115 L252 109 L240 115 L229 110 L218 115 Z M380 70 L408 90 L391 84 L380 90 L368 85 L355 90 Z M520 85 L549 105 L532 99 L520 105 L500 100 L480 105 Z M690 60 L715 80 L700 74 L690 80 L679 75 L668 80 Z M840 80 L873 100 L853 94 L840 100 L817 95 L794 100 Z M1010 75 L1042 95 L1023 89 L1010 95 L997 90 L983 95 Z M1170 90 L1214 110 L1188 104 L1170 110 L1147 105 L1124 110 Z" fill="#e5e7eb" opacity="0.8"/>
  <!-- ближние холмы -->
  <path d="M0 250 L120 205 L230 230 L360 190 L480 225 L600 200 L740 235 L880 205 L1010 232 L1150 210 L1280 235 L1280 320 L0 320 Z" fill="#2f3743"/>

  <!-- силуэт города -->
  <g fill="#1d232c">
    <rect x="40" y="262" width="34" height="58"/><rect x="80" y="246" width="26" height="74"/>
    <rect x="112" y="270" width="40" height="50"/><rect x="160" y="238" width="22" height="82"/>
    <rect x="188" y="258" width="46" height="62"/><rect x="242" y="272" width="30" height="48"/>
    <rect x="980" y="256" width="38" height="64"/><rect x="1024" y="236" width="24" height="84"/>
    <rect x="1054" y="266" width="44" height="54"/><rect x="1104" y="250" width="28" height="70"/>
    <rect x="1138" y="270" width="36" height="50"/><rect x="1180" y="244" width="26" height="76"/>
    <rect x="1212" y="262" width="40" height="58"/>
    <!-- телебашня Кок-Тобе -->
    <rect x="300" y="196" width="4" height="124"/><rect x="296" y="214" width="12" height="6"/>
    <!-- трубы ТЭЦ с дымом -->
    <rect x="900" y="232" width="10" height="88"/><rect x="920" y="244" width="10" height="76"/>
  </g>
  <g fill="#d6cbbb">
    <ellipse cx="912" cy="220" rx="10" ry="7" opacity="0.45"/><ellipse cx="930" cy="208" rx="16" ry="10" opacity="0.35"/><ellipse cx="958" cy="196" rx="24" ry="13" opacity="0.25"/><ellipse cx="996" cy="186" rx="34" ry="15" opacity="0.15"/>
    <ellipse cx="932" cy="234" rx="9" ry="6" opacity="0.45"/><ellipse cx="950" cy="224" rx="15" ry="9" opacity="0.35"/><ellipse cx="978" cy="214" rx="22" ry="12" opacity="0.25"/>
  </g>

  <!-- слой смога -->
  <rect x="0" y="150" width="1280" height="170" fill="url(#haze)"/>

  <!-- текст -->
  <text x="640" y="104" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Смог в Алматы</text>
  <text x="640" y="146" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#e5e7eb" letter-spacing="1">PM2.5 · сезонность · погода · прогноз</text>

  <!-- шкала качества воздуха -->
  <rect x="490" y="168" width="300" height="8" rx="4" fill="url(#bar)"/>
  <text x="490" y="194" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#f3f4f6">чисто</text>
  <text x="790" y="194" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#f3f4f6">опасно</text>
</svg>
